# Optional: the default install is a single process with no Docker (see README).
#   docker compose up                    -> SenseBench only
#   docker compose --profile graph up    -> SenseBench + Neo4j (optional Cypher exploration)
# Ports are published on 127.0.0.1 only, so team data stays on this machine.

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${SENSEBENCH_PORT:-8000}:8000"
    environment:
      SENSEBENCH_PORT: "8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me-please}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
